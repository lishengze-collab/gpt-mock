<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MATRIX // TERMINAL v1.0</title>
  <style>
    :root {
      --bg: #0d0f0d;
      --card-bg: #141714;
      --border: #223322;
      --green: #00ff66;
      --cyan: #00e5ff;
      --yellow: #ffb700;
      --red: #ff3366;
      --dim: #557755;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--green);
      font-family: 'Courier New', Courier, monospace, 'PingFang SC', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 顶部 Matrix Header & 仪表盘 */
    header {
      background: #090b09;
      border-bottom: 1px solid var(--border);
      padding: 10px 15px;
      flex-shrink: 0;
    }

    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .title-text {
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .dot { color: var(--green); margin-right: 4px; }

    .key-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--green);
      font-family: inherit;
      font-size: 10px;
      padding: 2px 6px;
      cursor: pointer;
      border-radius: 2px;
    }
    .key-btn:hover { background: var(--green); color: #000; }

    .stats-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 6px 8px;
      border-radius: 3px;
    }

    .stat-title {
      display: block;
      font-size: 9px;
      color: var(--dim);
      margin-bottom: 2px;
    }

    .stat-number {
      font-size: 13px;
      font-weight: bold;
    }

    .msgs-val { color: var(--green); }
    .chars-val { color: var(--cyan); }
    .tokens-val { color: var(--yellow); }
    .cost-val { color: var(--red); }

    /* 终端消息区 */
    .terminal-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .boot-line {
      font-size: 12px;
      color: #00993d;
      line-height: 1.4;
    }

    .msg-card {
      background: rgba(20, 23, 20, 0.6);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 4px;
      position: relative;
    }

    .msg-header {
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .user-header { color: var(--cyan); }
    .deepseek-header { color: var(--green); }

    .meta-char {
      color: #445544;
      font-weight: normal;
      font-size: 10px;
    }

    .msg-content {
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .user-content { color: #ffffff; }
    .deepseek-content { color: var(--green); }

    /* 输入区域 */
    .input-area {
      padding: 10px 15px;
      background: #090b09;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .input-area input {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--green);
      font-family: inherit;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 3px;
      outline: none;
    }

    .input-area input:focus { border-color: var(--green); }

    .input-area button {
      background: var(--green);
      color: #000;
      border: none;
      padding: 0 14px;
      font-family: inherit;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      border-radius: 3px;
    }

    /* 底部按钮栏 */
    .bottom-bar {
      background: #060806;
      border-top: 1px solid #152215;
      padding: 8px 15px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    .action-btn {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 6px;
      font-family: inherit;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 3px;
      text-align: center;
    }

    .btn-clear { color: var(--red); border-color: #33151f; }
    .btn-export { color: var(--yellow); border-color: #332915; }
  </style>
</head>
<body>

  <header>
    <div class="top-header">
      <div class="title-text"><span class="dot">●</span>MATRIX://TERMINAL <span style="font-size: 10px; opacity: 0.6;">v1.0</span></div>
      <button class="key-btn" onclick="setApiKey()">🔑 KEY</button>
    </div>
    <div class="stats-container">
      <div class="stat-card">
        <span class="stat-title">MSGS</span>
        <span class="stat-number msgs-val" id="stat-msgs">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-title">CHARS</span>
        <span class="stat-number chars-val" id="stat-chars">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-title">TOKENS</span>
        <span class="stat-number tokens-val" id="stat-tokens">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-title">EST. COST</span>
        <span class="stat-number cost-val" id="stat-cost">$0.0000</span>
      </div>
    </div>
  </header>

  <div class="terminal-body" id="terminal">
    <div class="boot-line">[BOOT] deepseek api status :: ACTIVE [OK]</div>
    <div class="boot-line">[BOOT] awaiting input_ type message or \search\</div>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="输入要查询或打卡的内容..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">发送</button>
  </div>

  <div class="bottom-bar">
    <button class="action-btn btn-clear" onclick="clearLog()">🗑 CLEAR LOG</button>
    <button class="action-btn btn-export" onclick="exportCSV()">📥 EXPORT CSV</button>
  </div>

  <script>
    let msgCount = 0;
    let charCount = 0;
    let tokenCount = 0;
    let historyLogs = [];

    function getApiKey() {
      return localStorage.getItem('DEEPSEEK_API_KEY') || '';
    }

    function setApiKey() {
      const currentKey = getApiKey();
      const newKey = prompt("请输入你的 DeepSeek API Key (存储在手机本地):", currentKey);
      if (newKey !== null) {
        localStorage.setItem('DEEPSEEK_API_KEY', newKey.trim());
        alert("API Key 已成功保存至手机本地！");
      }
    }

    function getTimeStr() {
      const d = new Date();
      return d.toTimeString().split(' ')[0];
    }

    function updateStats(addedChars, addedTokens) {
      msgCount++;
      charCount += addedChars;
      tokenCount += addedTokens;
      
      const estCost = (tokenCount / 1000) * 0.002;

      document.getElementById('stat-msgs').innerText = msgCount;
      document.getElementById('stat-chars').innerText = charCount;
      document.getElementById('stat-tokens').innerText = tokenCount;
      document.getElementById('stat-cost').innerText = '$' + estCost.toFixed(4);
    }

    async function sendMessage() {
      const inputEl = document.getElementById('userInput');
      const text = inputEl.value.trim();
      if (!text) return;

      const apiKey = getApiKey();
      if (!apiKey) {
        alert("首次使用请先设置 API Key！");
        setApiKey();
        return;
      }

      inputEl.value = '';
      const timeStr = getTimeStr();

      // 1. 渲染用户消息
      appendUserMessage(text, timeStr);
      historyLogs.push({ role: 'user', content: text, time: timeStr });
      updateStats(text.length, Math.ceil(text.length * 0.5));

      // 2. 渲染 AI 消息框（带实时打字流）
      const aiContentEl = createDeepSeekMessageHolder(timeStr);
      
      try {
        // 直连 DeepSeek API，开启流式输出 (stream: true)
        const response = await fetch('https://api.deepseek.com/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: 'deepseek-chat',
            messages: [
              { role: 'system', content: 'You are an AI assistant helping with English grammar, vocabulary, and learning.' },
              { role: 'user', content: text }
            ],
            stream: true
          })
        });

        if (!response.ok) {
          const errText = await response.text();
          throw new Error(`API 响应错误 (${response.status}): ${errText}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let fullAiText = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n');

          for (const line of lines) {
            if (line.startsWith('data: ') && line !== 'data: [DONE]') {
              try {
                const data = JSON.parse(line.slice(6));
                const content = data.choices[0]?.delta?.content || '';
                fullAiText += content;
                aiContentEl.innerText = fullAiText + '▌'; // 闪烁光标
                
                const term = document.getElementById('terminal');
                term.scrollTop = term.scrollHeight;
              } catch (e) {}
            }
          }
        }

        aiContentEl.innerText = fullAiText;
        historyLogs.push({ role: 'assistant', content: fullAiText, time: getTimeStr() });
        updateStats(fullAiText.length, Math.ceil(fullAiText.length * 0.6));

      } catch (err) {
        aiContentEl.innerText = `[ERROR] ${err.message}`;
        aiContentEl.style.color = '#ff3366';
      }
    }

    function appendUserMessage(text, timeStr) {
      const term = document.getElementById('terminal');
      const card = document.createElement('div');
      card.className = 'msg-card';

      card.innerHTML = `
        <div class="msg-header user-header">
          <span>[you@localhost ~]$ ${timeStr}</span>
          <span class="meta-char">${text.length} ch</span>
        </div>
        <div class="msg-content user-content">${escapeHtml(text)}</div>
      `;

      term.appendChild(card);
      term.scrollTop = term.scrollHeight;
    }

    function createDeepSeekMessageHolder(timeStr) {
      const term = document.getElementById('terminal');
      const card = document.createElement('div');
      card.className = 'msg-card';

      card.innerHTML = `
        <div class="msg-header deepseek-header">
          <span>[deepseek@matrix ~]# ${timeStr}</span>
        </div>
        <div class="msg-content deepseek-content">▌</div>
      `;

      term.appendChild(card);
      term.scrollTop = term.scrollHeight;
      return card.querySelector('.msg-content');
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function clearLog() {
      if (confirm("确定要清空控制台记录吗？")) {
        const term = document.getElementById('terminal');
        term.innerHTML = `
          <div class="boot-line">[BOOT] deepseek api status :: ACTIVE [OK]</div>
          <div class="boot-line">[BOOT] awaiting input_ type message or \\search\\</div>
        `;
        msgCount = 0; charCount = 0; tokenCount = 0;
        document.getElementById('stat-msgs').innerText = '0';
        document.getElementById('stat-chars').innerText = '0';
        document.getElementById('stat-tokens').innerText = '0';
        document.getElementById('stat-cost').innerText = '$0.0000';
        historyLogs = [];
      }
    }

    function exportCSV() {
      if (historyLogs.length === 0) {
        alert("暂无打卡/查词记录！");
        return;
      }
      let csvContent = "data:text/csv;charset=utf-8,\uFEFFTime,Role,Content\n";
      historyLogs.forEach(log => {
        const safeContent = `"${log.content.replace(/"/g, '""')}"`;
        csvContent += `${log.time},${log.role},${safeContent}\n`;
      });
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `matrix_export_${Date.now()}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
