<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>MATRIX://DEEPSEEK_TERMINAL</title>
<style>
  /* ============ GLOBAL VARIABLES ============ */
  :root{
    --vh: 1vh;
    --bg: #000000;
    --panel: #0a0d0a;
    --panel-2: #10151a;
    --border: #1c2b22;
    --green: #00ff66;
    --green-dim: #0a8f42;
    --blue: #00f0ff;
    --blue-dim: #0a7f8f;
    --amber: #ffb000;
    --red: #ff3b3b;
    --text-dim: #5c6b63;
    --mono-en: 'SF Mono','JetBrains Mono','Fira Code',Consolas,'Cascadia Code',monospace;
    --mono-cn: 'PingFang SC','Microsoft YaHei Mono','Microsoft YaHei',var(--mono-en);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}

  html,body{
    margin:0; padding:0;
    background:var(--bg);
    color:var(--green);
    font-family: var(--mono-en), var(--mono-cn);
    overscroll-behavior-y: none;
    overflow: hidden;
    height: 100%;
    width: 100%;
  }

  body{
    height: calc(var(--vh, 1vh) * 100);
    height: 100dvh;
    display:flex;
    flex-direction:column;
    position: relative;
  }

  /* CRT Scanline Effect */
  body::before{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    z-index:999;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,255,102,0.018) 0px,
      rgba(0,255,102,0.018) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: screen;
  }

  /* Scrollbar Styling */
  ::-webkit-scrollbar{ width:3px; }
  ::-webkit-scrollbar-thumb{ background: var(--green-dim); }
  ::-webkit-scrollbar-track{ background: transparent; }

  /* ============ STATUS BAR ============ */
  .statusbar{
    flex-shrink:0;
    padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 8px 12px;
    background: linear-gradient(180deg, #050705 0%, #000000 100%);
    border-bottom: 1px solid var(--border);
    position: relative;
    z-index: 10;
  }

  .statusbar-top{
    display:flex;
    align-items:center;
    justify-content: space-between;
    margin-bottom:8px;
  }

  .brand{
    font-size:14px;
    letter-spacing:1px;
    color: var(--green);
    display:flex;
    align-items:center;
    gap:6px;
    font-weight:700;
  }
  .brand .dot{
    width:7px; height:7px; border-radius:50%;
    background: var(--green);
    box-shadow: 0 0 6px var(--green), 0 0 12px var(--green);
    animation: blink-dot 1.6s infinite;
  }
  @keyframes blink-dot{
    0%,100%{ opacity:1; }
    50%{ opacity:.25; }
  }

  .brand .sub{
    color: var(--text-dim);
    font-size:10px;
    letter-spacing:0.5px;
  }

  .stats-grid{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap:6px;
  }

  .stat-cell{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius:10px;
    padding: 6px;
    position: relative;
    overflow:hidden;
  }
  .stat-cell .label{
    font-size:10px;
    color: var(--text-dim);
    letter-spacing:0.5px;
    text-transform:uppercase;
    margin-bottom:2px;
    white-space:nowrap;
  }
  .stat-cell .value{
    font-size:14px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .stat-cell.c-msg .value{ color: var(--blue); }
  .stat-cell.c-char .value{ color: var(--green); }
  .stat-cell.c-token .value{ color: var(--amber); }
  .stat-cell.c-cost .value{ color: var(--red); }

  /* ============ TERMINAL CHAT AREA ============ */
  .terminal{
    flex:1;
    min-height:0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 14px 12px 10px 12px;
    background: var(--bg);
  }

  .boot-line{
    color: var(--text-dim);
    font-size:11.5px;
    line-height:1.7;
    margin-bottom:14px;
    white-space:pre-wrap;
  }
  .boot-line .ok{ color: var(--green); }

  .msg{
    margin-bottom:14px;
    border-left: 2px solid var(--border);
    padding: 8px 12px;
    background: var(--panel);
    border-radius: 10px;
    animation: fade-in .25s ease-out;
  }
  @keyframes fade-in{
    from{ opacity:0; transform: translateY(4px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .msg.user{ border-left-color: var(--blue-dim); }
  .msg.ai{ border-left-color: var(--green-dim); }
  .msg.cmd{ border-left-color: var(--amber); }

  .msg-head{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:6px;
    font-size:11.5px;
  }
  .msg.user .prefix{ color: var(--blue); font-weight:700; }
  .msg.ai .prefix{ color: var(--green); font-weight:700; }
  .msg.cmd .prefix{ color: var(--amber); font-weight:700; }
  .msg-time{ color: var(--text-dim); font-size:10px; }
  .msg-meta{ color: var(--text-dim); font-size:10px; margin-left:auto; }

  .msg-body{
    font-size:14.5px;
    line-height:1.65;
    color: #d7ffe4;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .msg-body{ color: #cdeaff; }
  .msg.ai .msg-body{ color: #d7ffe4; }

  .cursor-blink{
    display:inline-block;
    width:7px; height:14px;
    background: var(--green);
    margin-left:2px;
    vertical-align: middle;
    animation: blink-dot 1s infinite;
  }

  .typing-row{
    display:flex; align-items:center; gap:6px;
    color: var(--text-dim); font-size:12px;
    padding-left:10px; margin-bottom:14px;
  }

  /* ============ BOTTOM CONSOLE ============ */
  .console{
    flex-shrink:0;
    border-top: 1px solid var(--border);
    background: linear-gradient(0deg, #050705 0%, #000000 100%);
    padding: 8px 10px calc(env(safe-area-inset-bottom, 0px) + 8px) 10px;
    position: relative;
    z-index: 10;
  }

  .toolbar{
    display:flex;
    gap:8px;
    margin-bottom:8px;
  }
  .tool-btn{
    flex:1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: inherit;
    font-size:11.5px;
    padding:8px 6px;
    border-radius:10px;
    letter-spacing:0.5px;
    display:flex; align-items:center; justify-content:center; gap:5px;
    -webkit-user-select:none; user-select:none;
  }
  .tool-btn:active{ background: var(--panel-2); }
  .tool-btn.clear{ color: var(--red); border-color:#3a1414; }
  .tool-btn.export{ color: var(--amber); border-color:#3a2f0f; }

  .input-row{
    display:flex;
    align-items:flex-end;
    gap:8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius:18px;
    padding:6px 6px 6px 14px;
  }
  .input-row .prompt-sign{
    color: var(--blue);
    font-size:14px;
    font-weight:700;
    padding-bottom:10px;
    flex-shrink:0;
  }
  #inputBox{
    flex:1;
    background: transparent;
    border:none;
    outline:none;
    resize:none;
    color: var(--green);
    font-family: inherit;
    font-size:15px; /* 15px prevents iOS Safari auto-zoom */
    line-height:1.5;
    max-height: 110px;
    padding:8px 4px;
    caret-color: var(--green);
  }
  #inputBox::placeholder{ color: var(--text-dim); }

  #sendBtn{
    flex-shrink:0;
    width:40px; height:40px;
    border-radius:14px;
    border:1px solid var(--green-dim);
    background: #041a0d;
    color: var(--green);
    font-size:16px;
    display:flex; align-items:center; justify-content:center;
    -webkit-user-select:none; user-select:none;
  }
  #sendBtn:active{ background: var(--green-dim); color:#000; }
  #sendBtn.sending{
    animation: pulse-send 0.9s infinite;
  }
  @keyframes pulse-send{
    0%,100%{ box-shadow: 0 0 0 rgba(0,255,102,0); }
    50%{ box-shadow: 0 0 10px rgba(0,255,102,0.6); }
  }
</style>
</head>
<body>

  <!-- ============ STATUS BAR ============ -->
  <div class="statusbar">
    <div class="statusbar-top">
      <div class="brand"><span class="dot"></span>MATRIX://TERMINAL<span class="sub">&nbsp;v1.0</span></div>
      <div class="sub" id="clock">--:--:--</div>
    </div>
    <div class="stats-grid">
      <div class="stat-cell c-msg">
        <div class="label">MSGS</div>
        <div class="value" id="statMsg">0</div>
      </div>
      <div class="stat-cell c-char">
        <div class="label">CHARS</div>
        <div class="value" id="statChar">0</div>
      </div>
      <div class="stat-cell c-token">
        <div class="label">TOKENS</div>
        <div class="value" id="statToken">0</div>
      </div>
      <div class="stat-cell c-cost">
        <div class="label">EST. COST</div>
        <div class="value" id="statCost">$0.0000</div>
      </div>
    </div>
  </div>

  <!-- ============ TERMINAL CHAT ============ -->
  <div class="terminal" id="terminal">
    <div class="boot-line" id="bootLine"></div>
  </div>

  <!-- ============ BOTTOM CONSOLE ============ -->
  <div class="console">
    <div class="toolbar">
      <div class="tool-btn clear" id="btnClear">🧹 CLEAR LOG</div>
      <div class="tool-btn export" id="btnExport">📥 EXPORT CSV</div>
    </div>
    <div class="input-row">
      <div class="prompt-sign">&gt;</div>
      <textarea id="inputBox" rows="1" placeholder="Type text or \search\ query..." enterkeyhint="send"></textarea>
      <div id="sendBtn">➤</div>
    </div>
  </div>

<script>
(function(){
  'use strict';

  /* Cloudflare Worker Endpoint */
  var CLOUDFLARE_WORKER_URL = "https://clsproxy.lishengze.workers.dev";

  /* =========================================================
     0. Viewport & Safe-Area Auto-Adaptation
  ========================================================= */
  function setVH(){
    var vh = window.innerHeight * 0.01;
    document.documentElement.style.setProperty('--vh', vh + 'px');
  }
  setVH();
  window.addEventListener('resize', setVH);
  window.addEventListener('orientationchange', setVH);

  if (window.visualViewport){
    var vv = window.visualViewport;
    function onVVChange(){
      var h = vv.height;
      document.body.style.height = h + 'px';
      window.scrollTo(0, 0);
      var vh = h * 0.01;
      document.documentElement.style.setProperty('--vh', vh + 'px');
      scrollToBottom();
    }
    vv.addEventListener('resize', onVVChange);
    vv.addEventListener('scroll', onVVChange);
  }

  /* =========================================================
     1. Global State
  ========================================================= */
  window.chatHistory = [];
  window.totalTokens = 0;
  var totalChars = 0;
  var PRICE_PER_1K_TOKEN = 0.002;

  var terminalEl   = document.getElementById('terminal');
  var inputBox     = document.getElementById('inputBox');
  var sendBtn      = document.getElementById('sendBtn');
  var statMsg      = document.getElementById('statMsg');
  var statChar     = document.getElementById('statChar');
  var statToken    = document.getElementById('statToken');
  var statCost     = document.getElementById('statCost');
  var bootLine     = document.getElementById('bootLine');
  var clockEl      = document.getElementById('clock');

  /* Boot Sequence Prompt */
  bootLine.innerHTML =
    '[BOOT] initializing secure shell ...\n' +
    '[BOOT] linking worker :: https://clsproxy.lishengze.workers.dev <span class="ok">[OK]</span>\n' +
    '[BOOT] deepseek api status :: ACTIVE <span class="ok">[OK]</span>\n' +
    '[BOOT] awaiting input_ type message or \\search\\ <query>';

  function tick(){
    var d = new Date();
    var p = function(n){ return (n<10?'0':'')+n; };
    clockEl.textContent = p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
  }
  tick(); setInterval(tick, 1000);

  /* =========================================================
     2. Utility Functions
  ========================================================= */
  function estimateTokens(text){
    var cjk = (text.match(/[\u4e00-\u9fa5]/g) || []).length;
    var other = text.length - cjk;
    return Math.max(1, Math.round(cjk / 1.7 + other / 4));
  }

  function fmtTime(d){
    var p = function(n){ return (n<10?'0':'')+n; };
    return p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
  }

  function scrollToBottom(){
    requestAnimationFrame(function(){
      terminalEl.scrollTop = terminalEl.scrollHeight;
    });
  }

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }

  function updateStats(){
    statMsg.textContent   = chatHistory.length;
    statChar.textContent  = totalChars;
    statToken.textContent = totalTokens;
    var cost = (totalTokens / 1000) * PRICE_PER_1K_TOKEN;
    statCost.textContent = '$' + cost.toFixed(4);
  }

  /* =========================================================
     3. Render Message
  ========================================================= */
  function renderMessage(entry){
    var wrap = document.createElement('div');
    var roleClass = entry.role === 'user' ? 'user' : (entry.role === 'cmd' ? 'cmd' : 'ai');
    wrap.className = 'msg ' + roleClass;

    var head = document.createElement('div');
    head.className = 'msg-head';

    var prefix = document.createElement('span');
    prefix.className = 'prefix';
    if(entry.role === 'user') prefix.textContent = '[you@localhost ~]$';
    else if(entry.role === 'cmd') prefix.textContent = '[search@engine ~]$';
    else prefix.textContent = '[deepseek@matrix ~]#';

    var time = document.createElement('span');
    time.className = 'msg-time';
    time.textContent = entry.time;

    var meta = document.createElement('span');
    meta.className = 'msg-meta';
    meta.textContent = entry.chars + ' chars · ' + entry.tokens + ' tok';

    head.appendChild(prefix);
    head.appendChild(time);
    head.appendChild(meta);

    var body = document.createElement('div');
    body.className = 'msg-body';
    body.innerHTML = escapeHtml(entry.content);

    wrap.appendChild(head);
    wrap.appendChild(body);
    terminalEl.appendChild(wrap);
    scrollToBottom();
    return body;
  }

  function showTyping(){
    var row = document.createElement('div');
    row.className = 'typing-row';
    row.id = 'typingRow';
    row.innerHTML = '&gt; DEEPSEEK processing response <span class="cursor-blink"></span>';
    terminalEl.appendChild(row);
    scrollToBottom();
  }
  function hideTyping(){
    var row = document.getElementById('typingRow');
    if (row) row.remove();
  }

  /* =========================================================
     4. Send Message & Cloudflare Worker Integration
  ========================================================= */
  async function sendMessage(text){
    if (!text || !text.trim()) return;
    text = text.trim();

    // Check for \search\ command
    var isSearchCmd = text.toLowerCase().startsWith('\\search\\');
    var searchQuery = '';
    if(isSearchCmd){
      searchQuery = text.substring(8).replace(/^\\/, '').trim();
    }

    // ---- 1. User Message Display ----
    var now = new Date();
    var userTokens = estimateTokens(text);
    var userEntry = {
      role: isSearchCmd ? 'cmd' : 'user',
      content: text,
      chars: text.length,
      tokens: userTokens,
      time: fmtTime(now)
    };
    chatHistory.push(userEntry);
    totalChars += userEntry.chars;
    totalTokens += userEntry.tokens;
    renderMessage(userEntry);
    updateStats();

    // ---- 2. Processing Request via Worker ----
    sendBtn.classList.add('sending');
    showTyping();

    try {
      var finalQuery = isSearchCmd 
        ? "Please act as a comprehensive dictionary, grammar, and syntax analysis assistant. Provide a detailed analysis, definitions, usage examples, and breakdown for: " + searchQuery 
        : text;

      var response = await fetch(CLOUDFLARE_WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: finalQuery })
      });

      var data = await response.json();
      var aiText = "";
      var aiTokens = 0;

      if (data.error) {
        aiText = "[SYSTEM ERROR] Worker returned an error:\n" + data.error;
      } else {
        aiText = data.reply || "[EMPTY RESPONSE]";
        aiTokens = data.tokens || estimateTokens(aiText);
      }

      hideTyping();
      var now2 = new Date();
      var aiEntry = {
        role: 'ai',
        content: aiText,
        chars: aiText.length,
        tokens: aiTokens,
        time: fmtTime(now2)
      };
      chatHistory.push(aiEntry);
      totalChars += aiEntry.chars;
      totalTokens += aiEntry.tokens;
      renderMessage(aiEntry);
      updateStats();

    } catch (err){
      hideTyping();
      var errEntry = {
        role: 'ai',
        content: '[CRITICAL ERROR] Failed to connect to Worker.\nDetails: ' + (err.message || err),
        chars: 0, 
        tokens: 0, 
        time: fmtTime(new Date())
      };
      chatHistory.push(errEntry);
      renderMessage(errEntry);
      updateStats();
    } finally {
      sendBtn.classList.remove('sending');
    }
  }
  window.sendMessage = sendMessage;

  /* =========================================================
     5. Input Interactions
  ========================================================= */
  function autoGrow(){
    inputBox.style.height = 'auto';
    inputBox.style.height = Math.min(inputBox.scrollHeight, 110) + 'px';
  }
  inputBox.addEventListener('input', autoGrow);

  function doSend(){
    var text = inputBox.value;
    if (!text.trim()) return;
    inputBox.value = '';
    autoGrow();
    sendMessage(text);
  }

  sendBtn.addEventListener('click', doSend);

  inputBox.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      doSend();
    }
  });

  inputBox.addEventListener('focus', function(){
    setTimeout(scrollToBottom, 300);
  });

  /* =========================================================
     6. Clear Logs
  ========================================================= */
  document.getElementById('btnClear').addEventListener('click', function(){
    if (chatHistory.length === 0) return;
    if (!confirm('Clear all conversation logs? This action cannot be undone.')) return;
    chatHistory = [];
    window.chatHistory = chatHistory;
    totalTokens = 0;
    window.totalTokens = 0;
    totalChars = 0;
    Array.prototype.slice.call(terminalEl.querySelectorAll('.msg, .typing-row')).forEach(function(el){
      el.remove();
    });
    updateStats();
  });

  /* =========================================================
     7. Export CSV
  ========================================================= */
  document.getElementById('btnExport').addEventListener('click', function(){
    if (chatHistory.length === 0){
      alert('No conversation logs available to export.');
      return;
    }
    var rows = [['INDEX','ROLE','CONTENT','CHARS','TOKENS','TIME']];
    chatHistory.forEach(function(entry, idx){
      var roleLabel = entry.role === 'user' ? 'USER' : (entry.role === 'cmd' ? 'SEARCH' : 'DEEPSEEK');
      var content = entry.content.replace(/"/g, '""').replace(/\n/g, ' ');
      rows.push([idx + 1, roleLabel, content, entry.chars, entry.tokens, entry.time]);
    });

    var csvContent = rows.map(function(row){
      return row.map(function(cell){
        return '"' + String(cell) + '"';
      }).join(',');
    }).join('\r\n');

    var BOM = '\uFEFF';
    var blob = new Blob([BOM + csvContent], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
    a.href = url;
    a.download = 'deepseek_terminal_log_' + stamp + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  /* Initialization */
  updateStats();
  scrollToBottom();

})();
</script>
</body>
</html>
