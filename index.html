<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MATRIX // TERMINAL</title>
  <style>
    :root {
      --bg-color: #0d0f0d;
      --card-bg: #141714;
      --border-color: #223322;
      --text-green: #00ff66;
      --text-dim: #00993d;
      --text-muted: #557755;
      --accent-cyan: #00e5ff;
      --accent-yellow: #ffb700;
      --accent-red: #ff3366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-green);
      font-family: 'Courier New', Courier, monospace, 'PingFang SC', sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* 顶部标题与仪表盘 */
    header {
      background: #090b09;
      border-bottom: 1px solid var(--border-color);
      padding: 10px 15px;
      flex-shrink: 0;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .title {
      font-weight: bold;
      font-size: 14px;
      letter-spacing: 1px;
    }

    .key-btn {
      background: transparent;
      border: 1px solid var(--text-dim);
      color: var(--text-green);
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
      border-radius: 3px;
    }
    .key-btn:hover { background: var(--text-dim); color: #000; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .stat-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 6px 8px;
      border-radius: 3px;
    }

    .stat-label {
      font-size: 9px;
      color: var(--text-muted);
      display: block;
    }

    .stat-val {
      font-size: 13px;
      font-weight: bold;
    }
    .stat-val.msgs { color: var(--text-green); }
    .stat-val.chars { color: var(--accent-cyan); }
    .stat-val.tokens { color: var(--accent-yellow); }
    .stat-val.cost { color: var(--accent-red); }

    /* 聊天终端区域 */
    .terminal-body {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .log-line {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .msg-card {
      background: rgba(20, 23, 20, 0.6);
      border-left: 2px solid var(--text-dim);
      padding: 10px;
      border-radius: 0 4px 4px 0;
      line-height: 1.5;
      font-size: 13px;
      word-break: break-word;
    }

    .msg-card.user {
      border-left-color: var(--accent-cyan);
    }
    .msg-card.user .msg-header {
      color: var(--accent-cyan);
    }

    .msg-card.deepseek {
      border-left-color: var(--text-green);
    }
    .msg-card.deepseek .msg-header {
      color: var(--text-green);
    }

    .msg-header {
      font-size: 11px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      opacity: 0.8;
    }

    .msg-content {
      white-space: pre-wrap;
    }

    /* 输入框与控制栏 */
    .input-area {
      padding: 10px 15px;
      background: #090b09;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .input-area input {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-green);
      padding: 10px 12px;
      font-family: inherit;
      font-size: 14px;
      border-radius: 4px;
      outline: none;
    }
    .input-area input:focus {
      border-color: var(--text-green);
    }

    .input-area button {
      background: var(--text-dim);
      color: #000;
      border: none;
      padding: 0 15px;
      font-weight: bold;
      font-family: inherit;
      cursor: pointer;
      border-radius: 4px;
    }
    .input-area button:active { opacity: 0.8; }

    .bottom-bar {
      background: #060806;
      border-top: 1px solid #152215;
      padding: 8px 15px;
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .bottom-btn {
      background: transparent;
      border: none;
      color: var(--accent-red);
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
    }
    .bottom-btn.export { color: var(--accent-yellow); }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <div class="title">● MATRIX://TERMINAL <span style="font-size:10px; opacity:0.6;">v1.0 (DIRECT)</span></div>
      <button class="key-btn" onclick="setApiKey()">🔑 KEY 设置</button>
    </div>
    <div class="stats-grid">
      <div class="stat-box">
        <span class="stat-label">MSGS</span>
        <span class="stat-val msgs" id="stat-msgs">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">CHARS</span>
        <span class="stat-val chars" id="stat-chars">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">TOKENS</span>
        <span class="stat-val tokens" id="stat-tokens">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">EST. COST</span>
        <span class="stat-val cost" id="stat-cost">$0.0000</span>
      </div>
    </div>
  </header>

  <div class="terminal-body" id="terminal">
    <div class="log-line">[BOOT] deepseek api status :: ACTIVE [OK]</div>
    <div class="log-line">[BOOT] mode :: DIRECT FRONTEND STREAMING</div>
    <div class="log-line">[BOOT] awaiting input_ type message or \search\</div>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="输入要查询或打卡的内容..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button onclick="sendMessage()">发送</button>
  </div>

  <div class="bottom-bar">
    <button class="bottom-btn" onclick="clearLog()">🗑 CLEAR LOG</button>
    <button class="bottom-btn export" onclick="exportCSV()">📥 EXPORT CSV</button>
  </div>

  <script>
    let msgCount = 0;
    let charCount = 0;
    let tokenCount = 0;
    let historyLogs = [];

    // 从手机浏览器本地获取 API Key
    function getApiKey() {
      return localStorage.getItem('DEEPSEEK_API_KEY') || '';
    }

    // 设置/更新 API Key
    function setApiKey() {
      const currentKey = getApiKey();
      const newKey = prompt("请输入你的 DeepSeek API Key (仅存保存在手机本地):", currentKey);
      if (newKey !== null) {
        localStorage.setItem('DEEPSEEK_API_KEY', newKey.trim());
        alert("API Key 已成功保存至当前设备的本地存储！");
      }
    }

    function getTimeStr() {
      const d = new Date();
      return d.toTimeString().split(' ')[0];
    }

    function updateStats(addedChars, addedTokens) {
      msgCount++;
      charCount += addedChars;
      tokenCount += addedTokens;
      
      const estCost = (tokenCount / 1000) * 0.002;

      document.getElementById('stat-msgs').innerText = msgCount;
      document.getElementById('stat-chars').innerText = charCount;
      document.getElementById('stat-tokens').innerText = tokenCount;
      document.getElementById('stat-cost').innerText = '$' + estCost.toFixed(4);
    }

    async function sendMessage() {
      const inputEl = document.getElementById('userInput');
      const text = inputEl.value.trim();
      if (!text) return;

      const apiKey = getApiKey();
      if (!apiKey) {
        alert("首次使用请先设置 API Key！");
        setApiKey();
        return;
      }

      inputEl.value = '';
      const timeStr = getTimeStr();

      // 1. 渲染用户发送的消息
      appendMessage('user', `[you@localhost ~]$ ${timeStr}`, text);
      historyLogs.push({ role: 'user', content: text, time: timeStr });
      updateStats(text.length, Math.ceil(text.length * 0.5));

      // 2. 创建 AI 打字机消息框
      const aiMsgContentEl = appendMessage('deepseek', `[deepseek@matrix ~]# ${getTimeStr()}`, '▌');
      
      try {
        // 🔥 直连 DeepSeek 官方 API 并开启流式输出 (stream: true)
        const response = await fetch('https://api.deepseek.com/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: 'deepseek-chat',
            messages: [
              { role: 'system', content: 'You are a helpful assistant for English learning, grammar, and vocabulary.' },
              { role: 'user', content: text }
            ],
            stream: true
          })
        });

        if (!response.ok) {
          const errText = await response.text();
          throw new Error(`API 响应错误 (${response.status}): ${errText}`);
        }

        // 读取 SSE 实时流数据
        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let fullAiText = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n');

          for (const line of lines) {
            if (line.startsWith('data: ') && line !== 'data: [DONE]') {
              try {
                const data = JSON.parse(line.slice(6));
                const content = data.choices[0]?.delta?.content || '';
                fullAiText += content;
                aiMsgContentEl.innerText = fullAiText + '▌'; // 实时打字效果 + 闪烁光标
                
                const term = document.getElementById('terminal');
                term.scrollTop = term.scrollHeight;
              } catch (e) {}
            }
          }
        }

        // 输出结束，移除光标
        aiMsgContentEl.innerText = fullAiText;
        historyLogs.push({ role: 'assistant', content: fullAiText, time: getTimeStr() });
        updateStats(fullAiText.length, Math.ceil(fullAiText.length * 0.6));

      } catch (err) {
        aiMsgContentEl.innerText = `[ERROR] ${err.message}`;
        aiMsgContentEl.style.color = '#ff3366';
      }
    }

    function appendMessage(role, headerText, initialContent) {
      const term = document.getElementById('terminal');
      const card = document.createElement('div');
      card.className = `msg-card ${role}`;

      const header = document.createElement('div');
      header.className = 'msg-header';
      header.innerText = headerText;

      const content = document.createElement('div');
      content.className = 'msg-content';
      content.innerText = initialContent;

      card.appendChild(header);
      card.appendChild(content);
      term.appendChild(card);

      term.scrollTop = term.scrollHeight;
      return content;
    }

    function clearLog() {
      if (confirm("确定要清空目前的控制台记录吗？")) {
        const term = document.getElementById('terminal');
        term.innerHTML = `
          <div class="log-line">[BOOT] deepseek api status :: ACTIVE [OK]</div>
          <div class="log-line">[BOOT] mode :: DIRECT FRONTEND STREAMING</div>
          <div class="log-line">[BOOT] awaiting input_ type message or \\search\\</div>
        `;
        msgCount = 0; charCount = 0; tokenCount = 0;
        document.getElementById('stat-msgs').innerText = '0';
        document.getElementById('stat-chars').innerText = '0';
        document.getElementById('stat-tokens').innerText = '0';
        document.getElementById('stat-cost').innerText = '$0.0000';
        historyLogs = [];
      }
    }

    function exportCSV() {
      if (historyLogs.length === 0) {
        alert("暂无聊天记录可供导出！");
        return;
      }
      let csvContent = "data:text/csv;charset=utf-8,\uFEFFTime,Role,Content\n";
      historyLogs.forEach(log => {
        const safeContent = `"${log.content.replace(/"/g, '""')}"`;
        csvContent += `${log.time},${log.role},${safeContent}\n`;
      });
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `terminal_export_${Date.now()}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
